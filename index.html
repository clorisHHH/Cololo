<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLOLO</title><link rel="stylesheet" href="styles.css"></head>
<body><script src="bubble-preview.js" defer></script>
<main class="app">
  <header class="appbar"><div class="brand"><img src="assets/cololo-logo.png" alt="COLOLO"><span class="brand-slogan">Image to Prompt</span></div><div class="bar-actions"><button id="settingsBtn" aria-label="设置">⋯</button><div id="shortcutPopover" class="shortcut-popover" hidden><strong>设置</strong><label class="setting-label">连接方式</label><div class="provider-picker"><button id="providerPickerButton" class="provider-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="providerPickerLabel">豆包</span><span class="provider-chevron" aria-hidden="true"></span></button><div id="providerMenu" class="provider-menu" role="listbox" hidden></div></div><select id="providerSelect" hidden><option value="auto">自动识别（推荐）</option><optgroup label="常用 OpenAI-compatible"><option value="doubao">豆包</option><option value="deepseek">DeepSeek</option><option value="qwen">通义千问</option><option value="moonshot">月之暗面 Kimi</option><option value="zhipu">智谱 AI</option><option value="siliconflow">SiliconFlow</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option><option value="openrouter">OpenRouter</option><option value="groq">Groq</option><option value="mistral">Mistral</option><option value="xai">xAI</option><option value="together">Together AI</option></optgroup><optgroup label="本地"><option value="ollama">Ollama（本机）</option></optgroup><option value="custom">自定义 OpenAI-compatible</option></select><small id="providerHint" class="setting-hint">自动模式只根据 Key 前缀做安全提示，无法确认时请手动选择服务商。</small><label class="setting-label" for="baseUrl">API Base URL</label><input id="baseUrl" type="url" placeholder="https://api.example.com/v1"><label class="setting-label" for="modelSelect">模型名称</label><input id="modelSelect" type="text" placeholder="输入模型名称"><div id="apiKeyField"><label class="setting-label" for="apiKey">API Key</label><input id="apiKey" type="password" placeholder="粘贴当前服务商 API Key"></div><button id="testApiBtn" class="setting-action">测试连接</button><small>以上配置与 API Key 只保存在本机</small></div></div></header>
  <section class="source-block"><img class="cat-mascot" src="assets/trace-sleepy-cat.png" alt="趴在导入框上的困困猫"><div class="block-head"><h2>图片</h2><button id="clearBtn" class="quiet" type="button" aria-label="清除图片" title="清除图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button><input id="fileInput" type="file" accept="image/*" hidden></div>
    <button id="languageToggle" class="language-toggle" type="button" aria-label="切换提示词语言"><span data-language="en">E</span><i>/</i><span data-language="zh">文</span></button><div id="dropzone" class="dropzone"><div id="emptyState"><button id="selectImageBtn" class="select-image" type="button" title="导入图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>导入图片</span></button><strong>截图后粘贴进来</strong><small>或拖入图片</small></div><img id="sourceImage" alt="源图片" hidden><div id="scanLine" hidden></div></div>
    <div class="source-foot"><button id="analyzeBtn" class="analyze" disabled>生成提示词 <span>→</span></button></div>
  </section>
  <section class="prompt-block" aria-label="提示词结果">
    <div id="promptComposer" class="composer" hidden><div><button id="clearPromptBtn" type="button" aria-label="清空提示词" title="清空提示词">×</button><button id="copyBtn" type="button" aria-label="复制" title="复制"><img src="copy_2_line.svg" alt=""></button></div><p id="composedPrompt"></p></div>
  </section>
</main><span id="floatingBubble" class="floating-bubble" hidden>生成好了</span><button id="floatingCat" class="floating-cat" type="button" aria-label="打开 COLOLO 浮窗" aria-expanded="false"><img class="floating-cat-idle" src="assets/trace-sleepy-cat.png" alt=""><img class="floating-cat-open" src="assets/trace-sleepy-cat-open.png" alt=""></button><aside id="floatingPanel" class="floating-panel" hidden><div class="floating-panel-head"><div><strong>COLOLO</strong><small>Image to Prompt</small></div><button id="closeFloatingPanel" type="button" aria-label="关闭浮窗">×</button></div><p>把图片粘贴给我，随时生成提示词。</p><button id="openWorkspace" class="floating-panel-action" type="button">打开工作台 <span>→</span></button></aside><script src="app.js?v=20260933"></script>
</body></html>
